[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aproxlab"
version = "1.0.0"
description = "Calculadora de aproximación funcional (regresión lineal y cuadrática) para Métodos Numéricos."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "AproxLab" }]
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0",
    "matplotlib>=3.8",
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.6",
]

[project.scripts]
aproxlab = "aproxlab.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
